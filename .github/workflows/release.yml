name: release

# Builds every platform and publishes a GitHub Release. Two ways to start it:
#  * push a tag such as v1.0.0, or
#  * Actions tab -> release -> "Run workflow" and type the tag (the tag is created for you).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0 (must match the version in Cargo.toml)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,   name: windows-arm64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version in Cargo.toml
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag '$TAG' must look like v1.2.3"; exit 1; fi
          want="${TAG#v}"
          have="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$want" != "$have" ]; then echo "Tag $TAG does not match Cargo.toml version $have"; exit 1; fi
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          ver="${TAG#v}"
          dir="syscheck-${ver}-${{ matrix.name }}"
          mkdir "$dir"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/syscheck.exe" "$dir/"
          else
            cp "target/${{ matrix.target }}/release/syscheck" "$dir/"
          fi
          cp README.md LICENSE "$dir/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$dir' -DestinationPath '$dir.zip'"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            syscheck-*.tar.gz
            syscheck-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum syscheck-* > SHA256SUMS
          cat > notes.md <<'NOTES'
          CORAL System Benchmark Utility: a native Rust benchmark that measures a machine and tells you what it is good for (virtualization host, NAS, media server, game server, AI / LLM, graphics, ray tracing).

          Download the archive for your system, unpack it and run `syscheck` (`syscheck.exe` on Windows). Verify the download with `SHA256SUMS`.

          | System | File |
          | --- | --- |
          | Linux x86-64 | `syscheck-*-linux-x86_64.tar.gz` |
          | Linux ARM64 | `syscheck-*-linux-aarch64.tar.gz` |
          | Windows x86-64 | `syscheck-*-windows-x86_64.zip` |
          | Windows ARM64 | `syscheck-*-windows-arm64.zip` |
          | macOS (Apple Silicon) | `syscheck-*-macos-arm64.tar.gz` |

          Only the Linux x86-64 build has been tested by the author on real hardware. The other builds compile in CI and are expected to work, but please report problems. For the documentation see the Wiki and the README.

          On macOS the downloaded program is not signed: if the system refuses to open it, run `xattr -d com.apple.quarantine syscheck` once.
          NOTES
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "CORAL System Benchmark Utility ${TAG#v}" --notes-file notes.md syscheck-* SHA256SUMS
